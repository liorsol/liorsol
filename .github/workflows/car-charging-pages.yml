# Deploys the charging dashboard page when its source changes.
#
# This deploys ONE half of the system: the page and its Functions, as a Cloudflare Pages project.
#
# The other half — the proxy that holds the credentials — is a Worker whose source is not in this
# repository and never will be, because this repository is public. It is deployed by hand, out of
# band. If you came here looking for its deploy step, it is not missing; it is deliberately
# absent. The two halves version independently: a page deploy never touches the proxy, and a
# proxy deploy never touches the page. Keep it that way — the moment CI can deploy the proxy, the
# proxy's secrets have to live in this repository's settings, which is the thing the split exists
# to prevent.
#
# Scope: only car-charging/**. The rest of this repository is an unrelated site deployed
# elsewhere and must not be triggered or touched by this workflow.
#
# Required GitHub Actions secrets (the repository owner adds these by hand; CI cannot):
#   CLOUDFLARE_API_TOKEN    an API token scoped to the Pages project
#   CLOUDFLARE_ACCOUNT_ID   the account the Pages project lives in
# Optional repository variable:
#   CF_PAGES_PROJECT        the Pages project name, if it is not the default below

name: Deploy charging page

on:
  push:
    branches: [main]
    paths:
      - 'car-charging/**'
      - '.github/workflows/car-charging-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: car-charging-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Uploads car-charging/ as static assets plus car-charging/functions/ as Pages Functions.
      #
      # `deploy . --cwd car-charging` is load-bearing and is not the same command as
      # `deploy car-charging`. Wrangler looks for functions/ relative to its working directory,
      # not inside the asset directory it is given, so the second form uploads the page, compiles
      # no Function, and /api/* quietly serves the 404 page. The grep below is the only thing
      # that tells the difference: a deploy that shipped a Function says so, and one that shipped
      # nothing is otherwise a green run.
      #
      # --branch decides production vs preview, so a manual run from a side branch lands on a
      # preview URL instead of the real one. Preview deployments carry no bindings by design
      # (see car-charging/README.md) and this log is public and permanent, URL included.
      - name: Deploy Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx wrangler@4 pages deploy . \
            --cwd car-charging \
            --project-name "${{ vars.CF_PAGES_PROJECT || 'car-charging' }}" \
            --branch "${{ github.ref_name }}" 2>&1 | tee deploy.log
          grep -q 'Compiled Worker successfully' deploy.log || {
            echo "::error::Deploy shipped no Function. /api/* would serve the static 404 page."
            exit 1
          }
