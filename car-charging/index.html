<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>לוח הטעינה</title>
<!--
  TWO SHEETS, AND THE ORDER IS THE CONTRACT. style.css is the base every look stands on: the
  reset, the accessibility floor, bidi and RTL correctness, the [hidden] rule, the router's
  display contract, the menu mechanics and the geometry of every custom property a JS module
  sets. themes/classic.css is today's DESIGN, and it is one of six. The theme sheet loads
  second, so at equal specificity a theme wins.

  `data-theme="classic"` on the link is how theme.js finds the sheet the first frame was
  painted with: it disables that same element rather than adding a second classic sheet.
  Every other theme's <link> is created by theme.js the first time it is chosen, and is then
  toggled with `link.disabled` — so switching back and forth refetches nothing and never
  flashes an unstyled page.
-->
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="themes/classic.css" data-theme="classic">
<!--
  theme.js is a SEPARATE module tag and it is first on purpose. It has no imports of its own,
  so it evaluates the moment it arrives, while app.js is still pulling api.js, views/he.js and
  views/auth.js. That is the whole difference it buys: the CSP below refuses an inline
  <script>, so the chosen theme cannot be stamped on <html> before a script runs, and the page
  paints classic for one moment first. Shortening that moment is what this tag is for. Do not
  try to defeat it with an inline script -- it is blocked silently and reads as a layout bug.
-->
<script type="module" src="theme.js"></script>
<script type="module" src="app.js"></script>
</head>
<body>
<!--
  Markup shell only. Every panel body below is empty and carries a stable id; app.js fills it
  by mounting a view module into it. No markup here knows what any view renders.

  Three things this file must never grow, each of which the shipped CSP blocks outright and
  silently (it reads as a layout bug, not as an error): an inline <script>, an inline <style>,
  and a style="..." attribute. Set a custom property from JS instead -- el.style.setProperty().

  No remote asset of any kind: no favicon fetch, no font link, no analytics. Same-origin
  relative paths only, so moving this page to another hostname stays a DNS change.

  lang and dir both belong on <html> and nowhere deeper, and neither is decoration:
  both style.css and every theme sheet scope their Hebrew typography to `[dir="rtl"]` as a
  DESCENDANT selector, and style.css translates the one word the views are forbidden to write
  into the DOM -- the "archived" tag on a note -- through `:lang(he)`. Move either attribute
  onto <body> or a panel and both silently stop matching, which reads as a design regression
  rather than as a missing attribute.

  `data-theme` is set on <html> too, by theme.js, and it is the third attribute on this
  element. It names the sheet that is enabled; it is NOT a styling hook a theme should key
  off, because a theme's own sheet is only ever on when its own theme is worn.

  ── THE SHAPE OF THIS PAGE: one screen, six views, a menu ──

  The owner's requirement, in their own words: "one page with menu ... most of the time we
  should see just current status. History, invoice and commenting should be in menu. The same
  way it was implemented in the travel webpages (either history and routing)."

  So the structure below is lifted from `trips/italy-2026`, not invented here:
    - every destination is a `.view` section inside <main>; exactly one carries `.is-active`;
    - the menu is a fixed rail from 900px up and an off-canvas drawer below it;
    - each menu item is a REAL `<a href="#/name">`. The browser's own hash navigation is the
      router: it writes a history entry, so Back and Forward work and every view is
      deep-linkable, and it keeps the item focusable and middle-clickable, which a
      `<a data-view>` with no href (the travel page's one weak spot) is not.
      The leading slash is not decoration. Two panel BODIES below carry the ids `history`
      and `comments`, so a bare `#history` is a fragment that really resolves: the browser
      would scroll that panel into view before the router ever ran. `#/history` can never
      name an element, so the hash is a route and nothing else. app.js still accepts the
      slashless form, so an old bookmark keeps working.

  A view switch paints nothing and fetches nothing. All six views are mounted and filled by
  the same `load()` round, so navigating between them is a class toggle over DOM that is
  already there. That is not an optimisation: an upstream call per menu press would break the
  invocation budget the whole one-hour cache rule exists to protect.
-->

<!-- The menu. app.js hides it whole while nobody is signed in: on that page the sign-in card
     IS the page, and six menu items leading to six empty views is the opposite of that.
     It is a sibling of `.shell` on purpose: `.nav[hidden] ~ .shell` is what gives the page
     its desktop gutter back when the rail goes, and `.nav.is-open ~ .navscrim` is what puts
     the scrim up on a phone. Both need the three to stay siblings, in this order. -->
<nav class="nav" id="nav" aria-label="תפריט ראשי">
  <div class="nav__bar">
    <span class="nav__brand">לוח הטעינה</span>
    <a class="nav__link" id="nav-status"   href="#/status">⚡ מצב כרגע</a>
    <a class="nav__link" id="nav-history"  href="#/history">🔌 טעינות</a>
    <a class="nav__link" id="nav-invoices" href="#/invoices">🧾 עמדה וחיובים</a>
    <a class="nav__link" id="nav-comments" href="#/comments">💬 הערות</a>
    <a class="nav__link" id="nav-sessions" href="#/sessions">🔑 חיבורים פעילים</a>
    <a class="nav__link" id="nav-contact"  href="#/contact">📞 יצירת קשר</a>
  </div>
</nav>
<div class="navscrim" id="navscrim"></div>

<div class="shell">

  <header class="shell__header">
    <div class="shell__header-inner">
      <!-- The drawer handle, below 900px only. It lives in the header rather than floating
           over the page because the header is sticky: the menu stays reachable from the
           bottom of a long history table, and no view has to reserve a corner for it. -->
      <button class="btn btn--icon navtoggle" type="button" id="navtoggle"
              aria-label="תפריט" aria-expanded="false" aria-controls="nav">☰</button>
      <h1 class="shell__title">טעינה</h1>
      <p class="updated" data-age="fresh">
        <span class="updated__abs">אין עדיין נתונים</span>
        <span class="updated__age">&mdash;</span>
      </p>
      <!-- NOT `.btn--small`, and that is the fix rather than an omission. `.btn--small` is the
           36px compact button; THEMES.md §8 lists the refresh control among the ones that must
           clear the 44px `--tap` floor, because it is pressed one-handed, standing next to a
           charger, by someone who has just walked up to the car. The two statements contradicted
           each other and two themes resolved it by overriding `#refresh` in their own sheets.
           Taking the class off resolves it once, here, at the source: a plain `.btn` is `--tap`
           in every theme, no sheet needs an id rule, and nothing can lower it by forgetting. -->
      <button class="btn" type="button" id="refresh">&#8635; רענון</button>

      <!-- The theme switcher. A real <select> because it is the native control: keyboard and
           screen-reader correct for free, a wheel on a phone and a menu on a laptop, and it
           costs nothing. theme.js fills the options -- it owns the list of themes and their
           Hebrew names, and a second copy of that list here is a second thing to keep in step.

           IT IS IN THE HEADER AND NOT IN THE MENU, AND THAT IS THE WHOLE POINT OF IT BEING
           HERE. app.js hides the rail and its handle on a signed-out page -- the sign-in card
           IS the page -- so a switcher living in the menu is unreachable in exactly the state
           a viewer would need it: if a chosen theme renders the sign-in card unreadable, they
           cannot switch away AND cannot sign in, and the only way back is clearing site data.
           The header is never hidden (paintAuthRequired touches <main>, `nav` and `navtoggle`
           and nothing else), so this control survives every state the page has.

           Its class is PARENT-NEUTRAL on purpose. A theme selects `.themeswitch` and never
           reaches it through `.shell__header-inner` or `.nav`, so this block can move again
           without breaking five sheets written against it. -->
      <div class="themeswitch">
        <label class="themeswitch__label" for="theme-select">ערכת נושא</label>
        <select class="themeswitch__select" id="theme-select"></select>
      </div>
    </div>
  </header>

  <!-- The expiry banner's mount. Left empty on purpose: views/controls.js creates the .expiry
       block inside it while the credential is expired and removes it again when it is healthy.
       Absent from the DOM, not hidden -- a hidden credential field fails the security test.
       Outside <main>, so it stays on screen whichever view is open: an expired credential is
       true of the charger, not of a menu item. -->
  <div id="expiry"></div>

  <main class="shell__main">

    <!-- THE DEFAULT VIEW. What the owner is looking at while standing next to the charger:
         what the connector says, the live session if there is one, the tariff window, and the
         two buttons. Nothing else, and no scrolling past anything else to reach the buttons. -->
    <section class="view is-active" id="view-status">
      <section class="panel">
        <div class="panel__head"><h2 class="panel__title">המחיר כרגע</h2></div>
        <div class="panel__body" id="tariff"></div>
      </section>

      <section class="panel">
        <div class="panel__head"><h2 class="panel__title">שליטה</h2></div>
        <div class="panel__body" id="controls"></div>
      </section>
    </section>

    <section class="view" id="view-history">
      <section class="panel">
        <div class="panel__head"><h2 class="panel__title">טעינות</h2></div>
        <div class="panel__body panel__body--flush" id="history"></div>
      </section>
    </section>

    <section class="view" id="view-invoices">
      <section class="panel">
        <div class="panel__head"><h2 class="panel__title">העמדה והחיובים</h2></div>
        <!-- NOT `--flush`, and #history beside it still is. The modifier exists so a table too
             wide to fit can run edge to edge and scroll; this panel stopped being a table. It is
             a charger summary and one card per billed period -- a heading, four stat tiles, a
             note and a download button -- and every one of those needs the panel's own inset. It
             was flush while the bills were a five-column table, and the leftovers of that read
             as a bug: the connector rows touched both panel borders and the download button sat
             flush against the bottom edge. -->
        <div class="panel__body" id="account"></div>
      </section>
    </section>

    <section class="view" id="view-comments">
      <section class="panel">
        <div class="panel__head"><h2 class="panel__title">הערות</h2></div>
        <div class="panel__body" id="comments"></div>
      </section>
    </section>

    <!-- The sign-in sessions of this dashboard, and the revoke control. NOT the charging
         sessions: those are #/history. One word, two tables, and the page keeps them on
         opposite sides of the menu so neither screen can be mistaken for the other. -->
    <section class="view" id="view-sessions">
      <section class="panel">
        <div class="panel__head"><h2 class="panel__title">חיבורים פעילים</h2></div>
        <div class="panel__body" id="sessions"></div>
      </section>
    </section>

    <!-- The one destination the data can take away. When /api/contact answers
         {"contact": null} there is nothing to show and may never be, so app.js hides the menu
         item AND detaches this section -- together, or `#/contact` would deep-link to a blank
         panel behind a menu that no longer offers it. Filling the values in on the private
         half brings both back on the next round; nothing in this directory changes. -->
    <section class="view" id="view-contact">
      <section class="panel">
        <div class="panel__head"><h2 class="panel__title">יצירת קשר</h2></div>
        <div class="panel__body" id="contact"></div>
      </section>
    </section>

  </main>

  <footer class="shell__footer">
    <div class="shell__footer-inner">
      לוח פרטי. שום דבר כאן לא מתרענן מעצמו &mdash; הנתונים זזים רק כשלוחצים רענון.
    </div>
  </footer>

</div>
</body>
</html>
