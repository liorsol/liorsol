<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Instant eSIM for Travelers | 210+ Countries from $1.32</title>
<meta name="theme-color" content="#9333ea">
<!-- ?theme=albania recolors this page to match trips/albania-2026, for embedding there. -->
<script>if (new URLSearchParams(location.search).get('theme') === 'albania') document.documentElement.dataset.theme = 'albania';</script>
<link rel="icon" href="https://esim.dog/esimdoglogo-nobg.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Heebo:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  /* esim.dog's own palette: esim-purple, esim-dark and the Tailwind shades their success page uses. */
  :root {
    --font: Inter, system-ui, sans-serif; --page-bg:#fff;
    --purple:#8b5cf6; --purple-500:#a855f7; --purple-600:#9333ea; --purple-800:#6b21a8;
    --purple-50:#faf5ff; --purple-100:#f3e8ff; --purple-200:#e9d5ff;
    --blue-50:#eff6ff; --blue-500:#3b82f6;
    --cyan-50:#ecfeff; --cyan-200:#a5f3fc; --cyan-400:#22d3ee; --cyan-600:#0891b2;
    --dark:#1e1b4b; --gray-200:#e5e7eb; --gray-500:#6b7280; --gray-600:#4b5563; --gray-700:#374151;
  }
  /* Albania trip page's own palette (trips/albania-2026/index.html) — same variables,
     different values, so every rule below repaints without a single selector change. */
  :root[data-theme="albania"] {
    --font: 'Heebo', system-ui, sans-serif; --page-bg:#f7efe0;
    --purple:#1b8a9e; --purple-500:#1b8a9e; --purple-600:#0c4b57; --purple-800:#072f38;
    --purple-50:#fbf6ec; --purple-100:#efe6d4; --purple-200:#e3d8c4;
    --blue-50:#fffdf8; --blue-500:#2bb8c4;
    --cyan-50:#fbf6ec; --cyan-200:#e3d8c4; --cyan-400:#2bb8c4; --cyan-600:#0c4b57;
    --dark:#1d2a2e;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--page-bg); color:var(--dark);
         font:16px/1.5 var(--font); -webkit-font-smoothing:antialiased; }
  main { max-width:28rem; margin:0 auto; padding:2rem 1rem; }

  header { display:flex; align-items:center; gap:.75rem; margin-bottom:2rem; }
  header img { width:3rem; height:3rem; }
  h1 { font-size:1.5rem; font-weight:800; margin:0; }

  .esim { background:linear-gradient(to bottom right,var(--purple-50),var(--blue-50));
          border:2px solid var(--purple-200); border-radius:1rem; padding:1.5rem; margin-bottom:1.5rem; }
  .esim > .top { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:.5rem; }
  .name { font-size:1.125rem; font-weight:700; }
  .used { font-size:1.5rem; font-weight:700; color:var(--purple-600); font-variant-numeric:tabular-nums; }
  .of { font-size:.875rem; color:var(--gray-600); }
  .track { width:100%; height:1rem; background:var(--gray-200); border-radius:999px; overflow:hidden; }
  .fill { height:1rem; width:0; border-radius:999px; transition:width .5s;
          background:linear-gradient(to right,var(--purple-500),var(--blue-500)); }
  .fill.warn { background:linear-gradient(to right,#f59e0b,#f97316); }
  .fill.hot  { background:linear-gradient(to right,#ef4444,#dc2626); }
  /* Refreshing: every bar sweeps at once, so it is obvious all four are being re-read. */
  .esim.loading .track { background:linear-gradient(90deg,var(--gray-200) 25%,var(--purple-200) 50%,var(--gray-200) 75%);
                         background-size:200% 100%; animation:sweep 1.1s linear infinite; }
  .esim.loading .fill { opacity:.35; }
  .esim.loading .used, .esim.loading .of, .esim.loading .under { opacity:.4; }
  .esim .used, .esim .of, .esim .under, .esim .fill { transition:opacity .2s; }
  /* Idle: a static arrow icon. Loading: swapped for a spinning ring, like esim.dog's own
     loading spinner (animate-spin rounded-full border-b-2) — nicer than rotating the arrow. */
  .icon-idle { display:inline-flex; vertical-align:-3px; }
  .icon-loading { display:none; width:15px; height:15px; margin-inline-end:.125rem;
                  border-radius:50%; border:2.5px solid rgba(255,255,255,.35);
                  border-bottom-color:#fff; vertical-align:-3px; }
  button.refresh.loading .icon-idle { display:none; }
  button.refresh.loading .icon-loading { display:inline-block; animation:spin .7s linear infinite; }
  @keyframes sweep { from { background-position:200% 0 } to { background-position:-200% 0 } }
  @keyframes spin { to { transform:rotate(360deg) } }
  @media (prefers-reduced-motion:reduce) {
    .esim.loading .track, button.refresh.loading .icon-loading { animation:none; }
  }

  .under { display:flex; justify-content:space-between; align-items:center;
           margin-top:.5rem; font-size:.875rem; }
  .under .left { font-weight:600; color:var(--gray-700); }
  .under .right { color:var(--gray-600); }

  details.sim { margin-top:1rem; }
  details.sim > summary { list-style:none; cursor:pointer; display:inline-flex; align-items:center; gap:.375rem;
                          font-size:.75rem; font-weight:600; color:var(--purple-600); }
  details.sim > summary::-webkit-details-marker { display:none; }
  details.sim > summary::after { content:'+'; font-size:1rem; line-height:1; }
  details.sim[open] > summary::after { content:'−'; }
  details.sim > summary:hover { color:var(--purple-800); }
  .fields { margin-top:.75rem; background:rgba(255,255,255,.6); border:1px solid var(--purple-100);
            border-radius:.75rem; padding:.75rem; display:grid; grid-template-columns:auto 1fr;
            gap:.5rem .75rem; font-size:.8125rem; }
  .fields dt { color:var(--gray-500); } .fields dd { margin:0; font-weight:600; text-align:right; }
  .fields dd.mono { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:.75rem; }
  .simlinks { display:grid; gap:.5rem; margin-top:.75rem; }
  .simlinks a { font-size:.75rem; font-weight:700; text-decoration:none; color:#fff;
                padding:.625rem; border-radius:.75rem; text-align:center; }
  .simlinks a.amber { background:#f59e0b; } .simlinks a.orange { background:#f97316; }
  .simlinks a.neutral { color:var(--purple-600); background:rgba(255,255,255,.6); border:1px solid var(--purple-200); }

  button.refresh { width:100%; padding:.875rem; font:700 1rem var(--font); color:#fff;
                   background:var(--purple); border:0; border-radius:.75rem; cursor:pointer; }
  button.refresh:hover { background:var(--purple-600); }
  button.refresh:disabled { opacity:.6; cursor:default; }
  .status { text-align:center; font-size:.75rem; color:var(--gray-500); min-height:1.125rem; margin:.75rem 0 2rem; }
  .err { color:#b91c1c; }

  .help { background:#fff; border:1px solid var(--gray-200); border-radius:1rem; overflow:hidden; margin-bottom:1.5rem; }
  .help > summary { list-style:none; cursor:pointer; background:#f9fafb; padding:1.25rem;
                    display:flex; align-items:center; gap:.75rem; font-weight:700; }
  .help > summary::-webkit-details-marker { display:none; }
  .help > summary .sub { display:block; font-size:.875rem; font-weight:400; color:var(--gray-600); }
  .help .links { background:#f9fafb; padding:1rem; display:grid; gap:.75rem; border-top:1px solid var(--gray-200); }
  .help .links a { display:block; padding:.75rem; border-radius:.75rem; text-decoration:none;
                   font-weight:600; color:var(--dark); text-align:center; }
  .help .links a.blue { background:var(--blue-50); border:1px solid #bfdbfe; }
  .help .links a.purple { background:var(--purple-50); border:1px solid var(--purple-200); }

  .game { background:linear-gradient(to bottom right,var(--cyan-50),#e0f2fe);
          border:2px solid var(--cyan-200); border-radius:1.5rem; padding:1.5rem; text-align:center; }
  .game h2 { font-size:1.125rem; font-weight:700; margin:0 0 .25rem; }
  .game .sub { font-size:.875rem; color:var(--gray-500); margin:0 0 1rem; }
  .game .frame { display:inline-block; border:2px solid var(--cyan-200); border-radius:.75rem;
                 overflow:hidden; background:#fff; }
  canvas { display:block; image-rendering:pixelated; max-width:100%; height:auto; touch-action:manipulation; }
  .game .hint { font-size:.875rem; font-weight:600; color:var(--cyan-600); margin:.75rem 0 0; }
</style>
</head>
<body>
<main>
<header>
  <img src="https://esim.dog/esimdoglogo-nobg.png" alt="eSIM.dog">
  <h1>eSIM Data Usage</h1>
</header>

<div id="bars"></div>

<button class="refresh" id="refresh"><span class="icon-idle"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3.1-6.8"/><polyline points="21 3 21 9 15 9"/></svg></span><span class="icon-loading" aria-hidden="true"></span> Refresh all</button>
<p class="status" id="status"></p>

<details class="help">
  <summary><span style="font-size:1.5rem">📚</span>
    <span>Installation Instructions &amp; Help<span class="sub">Guides, FAQ, and troubleshooting</span></span>
  </summary>
  <div class="links">
    <a class="blue" href="https://esim.dog/installation-instructions" target="_blank" rel="noopener">📱 Installation Instructions</a>
    <a class="purple" href="https://esim.dog/faq" target="_blank" rel="noopener">❓ FAQ</a>
  </div>
</details>

<div class="game">
  <div class="frame"><canvas id="game" width="400" height="200"></canvas></div>
  <p class="hint" id="gameHint">Tap or press SPACE to jump over obstacles</p>
</div>

<script>
// ponytail: ICCIDs are the only identifier check-esim-usage strictly needs — but the
// order link is now stored too (below), at the user's request, as a fallback if the
// proxy ever breaks. That does put a live esim.dog order link in this public repo: it
// opens the same page anyone with the confirmation email could already reach, but
// which shows the QR/activation code, so anyone who finds this file can view it too.
// Plan fields are per eSIM on purpose: identical today, but a different order won't lie.
const ESIMS = [
  { name: 'ליאור', iccid: '8948010010087231980', order: 'payment_intent=pi_3U3hq4P3rsvFckzp0zjmDp7s',
    purchasedAt: '2026-08-12T19:29:24.000Z' },
  { name: 'מור',   iccid: '8948010010087232053', order: 'session_id=cs_live_b1OFaJbN2bEMlZ1Si03bze4zXAYMb9x9geolH88VHzKhHdXYTIvuxCRLtR',
    purchasedAt: '2026-08-12T19:59:43.000Z' },
  { name: 'זואי',  iccid: '8948010010087232079', order: 'session_id=cs_live_b1OetwN2mN5lIVYrRzKUmgbKNqAV0J6to3EH32Xu81HbGslF9dZAbibRT7',
    purchasedAt: '2026-08-12T20:05:58.000Z' },
  { name: 'הרצל',  iccid: '8948010010087232699', order: 'session_id=cs_live_b1NQVFBMocoUDjSUuLHZjZhMQt1VgWAPoLoMWNfHeAs7ERCLRNFhfhUF3P',
    purchasedAt: '2026-08-13T04:39:09.000Z' },
].map(e => ({
  country: 'Albania', plan: '12GB - 30 days validity', coverage: 'LTE + 5G',
  networks: 'One', smdp: 'smdp.io', apn: 'plus', providerCode: 4, // BLACK_AL_12GB_30D
  purchasedWith: 'xlllsss@gmail.com',
  ...e,
}));

// esim.dog's usage endpoint is POST-only and sends no CORS headers, so the browser
// cannot call it directly. Public proxies are no help either: they all forward as GET
// and the function answers 405. So every request goes through proxy.js in this folder.
// Hardcoded on purpose: the worker only answers for the ICCIDs above, so its URL is not
// a secret — and requiring ?proxy= per device meant every phone got an error instead.
const ENDPOINT = new URLSearchParams(location.search).get('proxy')
  || 'https://esim-usage-proxy.xlllsss.workers.dev';

const GB = 1024 ** 3;
const fmtGB = b => (b / GB).toFixed(2) + ' GB';
const pct = (used, total) => total > 0 ? Math.min(100, used / total * 100) : 0;

const statusEl = document.getElementById('status');
const btn = document.getElementById('refresh');

document.getElementById('bars').innerHTML = ESIMS.map((e, i) => `
  <div class="esim">
    <div class="top">
      <span class="name">${e.name}</span>
      <span><span class="used" id="used${i}">—</span> <span class="of" id="of${i}"></span></span>
    </div>
    <div class="track"><div class="fill" id="fill${i}"></div></div>
    <div class="under">
      <span class="left" id="left${i}">not loaded yet</span>
      <span class="right" id="right${i}"></span>
    </div>
    <details class="sim">
      <summary>eSIM details</summary>
      <dl class="fields">
        <dt>ICCID</dt><dd class="mono">${e.iccid}</dd>
        <dt>Country</dt><dd>${e.country}</dd>
        <dt>Plan</dt><dd>${e.plan}</dd>
        <dt>Coverage</dt><dd>${e.coverage}</dd>
        <dt>Networks</dt><dd>${e.networks}</dd>
        <dt>SM-DP+</dt><dd class="mono">${e.smdp}</dd>
        <dt>APN</dt><dd class="mono">${e.apn}</dd>
        <dt>Purchased</dt><dd>${new Date(e.purchasedAt).toLocaleString(undefined,
          { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })}</dd>
        <dt>Purchased with</dt><dd>${e.purchasedWith}</dd>
      </dl>
      <div class="simlinks">
        <a class="amber" target="_blank" rel="noopener"
           href="https://esim.dog/cannot-activate-esim?country=${encodeURIComponent(e.country)}&smdp=${encodeURIComponent(e.smdp)}">⚠️ Cannot activate an eSIM?</a>
        <a class="orange" target="_blank" rel="noopener"
           href="https://esim.dog/internet-not-working?apn=${encodeURIComponent(e.apn)}&smdp=${encodeURIComponent(e.smdp)}&country=${encodeURIComponent(e.country)}">🌐 Activated, but internet not working?</a>
        <a class="neutral" target="_blank" rel="noopener"
           href="https://esim.dog/success?${e.order}">↗ View on esim.dog (if this page can't reach the usage API)</a>
      </div>
    </details>
  </div>`).join('');

function render(i, u) {
  const p = pct(u.dataUsage, u.totalData);
  const fill = document.getElementById('fill' + i);
  fill.style.width = p + '%';
  fill.className = 'fill' + (p >= 90 ? ' hot' : p >= 75 ? ' warn' : '');
  document.getElementById('used' + i).textContent = fmtGB(u.dataUsage);
  document.getElementById('of' + i).textContent = 'of ' + fmtGB(u.totalData);
  document.getElementById('left' + i).textContent = p.toFixed(1) + '% used';
  document.getElementById('right' + i).textContent =
    `${fmtGB(u.remainingData)} left · ${u.status}` +
    (u.expiryDate ? ` · expires ${new Date(u.expiryDate).toLocaleDateString()}` : '');
}

async function fetchUsage() {
  const r = await fetch(ENDPOINT, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ iccidList: ESIMS.map(e => e.iccid), providerCode: ESIMS[0].providerCode }),
  });
  const j = await r.json();
  if (!r.ok || !j.success) throw new Error(j.error || 'HTTP ' + r.status);
  return j.usage;
}

async function refresh() {
  const cards = document.querySelectorAll('.esim');
  cards.forEach(c => c.classList.add('loading'));
  btn.classList.add('loading');
  btn.disabled = true;
  statusEl.textContent = 'Loading…';
  try {
    const usage = await fetchUsage();
    ESIMS.forEach((e, i) => {
      const u = usage.find(x => x.iccid === e.iccid);
      if (u) render(i, u);
      else document.getElementById('left' + i).textContent = 'no usage data yet';
    });
    statusEl.textContent = 'Updated ' + new Date().toLocaleTimeString() +
      ' · esim.dog refreshes usage every 2-3 hours';
  } catch (e) {
    statusEl.innerHTML = `<span class="err">Could not reach the usage API (${e.message}).</span>` +
      `<br>If this network or browser blocks <code>*.workers.dev</code> (VPN, Zero Trust,
       ad blocker), that is the usual cause — the console error says which.`;
  } finally {
    cards.forEach(c => c.classList.remove('loading'));
    btn.classList.remove('loading');
    btn.disabled = false;
  }
}
btn.addEventListener('click', refresh);

// ponytail: assert-based self-check, open ?selftest=1 to run it instead of the live fetch.
if (!new URLSearchParams(location.search).has('selftest')) {
  refresh();
} else {
  const ok = (c, m) => { if (!c) throw new Error('selftest: ' + m); };
  ok(fmtGB(12884901888) === '12.00 GB', 'fmtGB 12GiB');
  ok(fmtGB(0) === '0.00 GB', 'fmtGB zero');
  ok(pct(0, 12884901888) === 0, 'pct zero');
  ok(pct(6442450944, 12884901888) === 50, 'pct half');
  ok(pct(99, 0) === 0, 'pct guards divide-by-zero');
  ok(pct(999, 100) === 100, 'pct clamps');
  ok(new Set(ESIMS.map(e => e.iccid)).size === ESIMS.length, 'no duplicate ICCIDs');
  ok(ESIMS.every(e => /^\d{19,20}$/.test(e.iccid)), 'ICCIDs look like ICCIDs');
  // One batched call carries a single providerCode, so a mixed-route set must fail loudly here
  // rather than silently querying every eSIM with the first one's route.
  ok(new Set(ESIMS.map(e => e.providerCode)).size === 1, 'all eSIMs share one providerCode');
  ok(ESIMS.every(e => /^(session_id|payment_intent)=\S+$/.test(e.order)), 'order links look like esim.dog query strings');
  ok(ESIMS.every(e => !Number.isNaN(new Date(e.purchasedAt).getTime())), 'purchasedAt parses as a date');
  statusEl.textContent = 'selftest passed';
}
</script>

<script>
// Runner clone of the esim.dog mini-game: their sprites, 10 pts/sec, 1000 to win.
// The death/win sequences are copied from their bundle: on a hit, the dog keeps
// falling under gravity while just the obstacle it hit plays its own break-frame
// animation (everything else on screen freezes); once it lands, GAME OVER shows.
// Winning freezes the run and bounces the dog over a gold tint until reset.
(() => {
  const c = document.getElementById('game'), x = c.getContext('2d');
  const GROUND = 20, DOG = 72, FLOOR = c.height - GROUND - DOG, WIN = 1000;
  const hint = document.getElementById('gameHint');
  const sheet = (file, frames) => { const i = new Image(); i.src = 'https://esim.dog/mini-game/' + file; i.frames = frames; return i; };
  const run = sheet('running_dog_mascot.png', 6), die = sheet('dying_dog_mascot.png', 4);
  // Same obstacle art, scales and frame counts as the original.
  const OBS = {
    box1:    { w: 28 * 1.8, h: 28 * 1.8, dir: 'Box1', n: 5 },
    box2:    { w: 32 * 1.6, h: 32 * 1.6, dir: 'Box2', n: 3 },
    capsule: { w: 50 * 1.2, h: 48 * 1.2, dir: 'Capsule', n: 4 },
  };
  const TYPES = Object.keys(OBS);
  for (const t of TYPES) {
    OBS[t].img = Array.from({ length: OBS[t].n }, (_, k) => {
      const im = new Image(); im.src = `https://esim.dog/mini-game/obstacles/${OBS[t].dir}/${k + 1}.png`; return im;
    });
  }
  let s, last;

  const reset = () => { s = {
    y: FLOOR, v: 0, obs: [], speed: 300, t: 0, spawn: 0, ground: 0,
    dead: 0, over: false, won: false, deathFrame: 0, deathTimer: 0, hit: null, wonT: 0,
  }; };
  reset();
  window.__game = () => s; // ponytail: the only way to check the loop without pixel-reading a tainted canvas

  function jump() {
    if (s.won) return;
    if (s.over) { reset(); return; }
    if (s.dead) return; // mid-death animation: input is ignored, same as the original
    if (s.y >= FLOOR) s.v = -650;
  }
  c.addEventListener('mousedown', e => { e.preventDefault(); jump(); });
  c.addEventListener('touchstart', e => { e.preventDefault(); jump(); }, { passive: false });
  addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); jump(); }
  });

  function dieStep(dt) {
    if (s.y < FLOOR) {
      s.v += 1800 * dt; s.y += s.v * dt;
      if (s.y > FLOOR) { s.y = FLOOR; s.v = 0; }
    }
    s.deathTimer += dt;
    if (s.deathTimer >= 0.15) { s.deathFrame = Math.min(s.deathFrame + 1, die.frames - 1); s.deathTimer = 0; }
    if (s.hit) {
      s.hit.hitTimer += dt;
      const maxFrame = OBS[s.hit.type].n - 1;
      if (s.hit.hitTimer >= 0.05 && s.hit.hitFrame < maxFrame) { s.hit.hitFrame++; s.hit.hitTimer = 0; }
    }
    if (s.y >= FLOOR && s.deathFrame >= die.frames - 1) s.over = true;
  }

  function step(dt) {
    if (s.won) { s.wonT += dt; s.ground = (s.ground + s.speed * 0.3 * dt) % 20; return; }
    if (s.dead) { dieStep(dt); return; }
    s.t += dt;
    s.ground = (s.ground + s.speed * dt) % 20;
    s.v += 1800 * dt; s.y += s.v * dt;
    if (s.y > FLOOR) { s.y = FLOOR; s.v = 0; }
    s.obs.forEach(o => o.x -= s.speed * dt);
    s.obs = s.obs.filter(o => o.x > -80);
    if (s.t - s.spawn > Math.max(0.55, 1 - (s.speed - 300) / 1500) + Math.random() * 0.6) {
      const type = TYPES[Math.floor(Math.random() * TYPES.length)];
      s.obs.push({ x: c.width, w: OBS[type].w, h: OBS[type].h, type });
      s.spawn = s.t;
    }
    if (s.speed < 600) s.speed += 5 * dt;
    const dog = { x: 62, y: s.y + 15, w: DOG - 30, h: DOG - 20 };
    for (const o of s.obs) {
      if (dog.x < o.x + o.w * 0.8 && dog.x + dog.w > o.x + o.w * 0.2 &&
          dog.y + dog.h > c.height - GROUND - o.h) {
        s.dead = 1; s.deathFrame = 0; s.deathTimer = 0;
        o.hitFrame = 0; o.hitTimer = 0; s.hit = o;
        return;
      }
    }
    if (Math.floor(s.t * 10) >= WIN) {
      s.won = true; s.wonT = 0;
      hint.textContent = '🏆 Beaten! Claim the 10% code on your esim.dog order page';
    }
  }

  const ready = img => img && img.complete && img.naturalWidth > 0;

  function draw() {
    const score = Math.floor(s.t * 10);
    x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);

    x.fillStyle = '#535353';
    x.fillRect(0, c.height - GROUND, c.width, 2);
    for (let i = -s.ground; i < c.width; i += 20) x.fillRect(i, c.height - GROUND + 5, 6, 2);

    for (const o of s.obs) {
      const spec = o.type && OBS[o.type];
      const frame = o === s.hit ? o.hitFrame : 0;
      const img = spec && spec.img[frame];
      if (ready(img)) x.drawImage(img, o.x, c.height - GROUND - o.h, o.w, o.h);
      else { x.fillStyle = '#a855f7'; x.fillRect(o.x, c.height - GROUND - o.h, o.w, o.h); }
    }

    let dogImg, frame, drawY = s.y;
    if (s.won) {
      dogImg = run; frame = Math.floor(s.wonT * 12) % run.frames;
      drawY = s.y - 5 * Math.sin(4 * s.wonT); // the original's victory bounce
    } else if (s.dead) {
      dogImg = die; frame = s.deathFrame;
    } else {
      dogImg = run; frame = Math.floor(s.t * 12) % run.frames;
    }
    if (ready(dogImg)) x.drawImage(dogImg, 48 * frame, 0, 48, 48, 50, drawY, DOG, DOG);
    else { x.fillStyle = '#8b5cf6'; x.fillRect(50, drawY + 10, 62, 52); }

    x.fillStyle = '#535353'; x.font = 'bold 14px monospace'; x.textAlign = 'right';
    x.fillText(String(score).padStart(5, '0'), c.width - 10, 24);
    x.textAlign = 'center';
    if (s.won) {
      x.fillStyle = 'rgba(255, 215, 0, 0.2)'; x.fillRect(0, 0, c.width, c.height);
      x.fillStyle = '#e3a300'; x.font = 'bold 22px monospace';
      x.fillText('YOU WIN!', c.width / 2, c.height / 2 - 20);
      x.fillStyle = '#535353'; x.font = 'bold 14px monospace';
      x.fillText('Score: ' + score, c.width / 2, c.height / 2 + 8);
      x.fillStyle = '#0891b2'; x.font = '12px monospace';
      x.fillText('10% off — claim it on esim.dog', c.width / 2, c.height / 2 + 30);
    } else if (s.over) {
      x.fillStyle = 'rgba(0, 0, 0, 0.3)'; x.fillRect(0, 0, c.width, c.height);
      x.fillStyle = '#535353';
      x.font = 'bold 20px monospace'; x.fillText('GAME OVER', c.width / 2, c.height / 2 - 20);
      x.font = '14px monospace';
      x.fillText('Score: ' + score, c.width / 2, c.height / 2 + 10);
      x.fillText('Tap to try again', c.width / 2, c.height / 2 + 35);
    } else if (s.t === 0) {
      x.font = 'bold 14px monospace';
      x.fillText('Tap or press SPACE to start', c.width / 2, c.height / 2 - 20);
      x.fillText('Score ' + WIN + ' to win!', c.width / 2, c.height / 2 + 5);
    }
  }

  requestAnimationFrame(function loop(now) {
    const dt = last ? Math.min((now - last) / 1000, 0.05) : 0; last = now;
    if (s.v || s.y < FLOOR || s.obs.length || s.t || s.dead || s.won) step(dt);
    draw();
    requestAnimationFrame(loop);
  });
})();
</script>
</main>
</body>
