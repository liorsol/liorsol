<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Repo browser</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
  :root { color-scheme: dark; --bg:#0d1117; --panel:#161b22; --line:#30363d; --fg:#c9d1d9; --accent:#58a6ff; }
  * { box-sizing: border-box; }
  body { margin:0; height:100vh; display:flex; font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; background:var(--bg); color:var(--fg); }
  #side { width:320px; min-width:180px; max-width:60vw; resize:horizontal; overflow:auto; border-right:1px solid var(--line); background:var(--panel); padding:8px; }
  #filter { width:100%; padding:6px 8px; margin-bottom:8px; background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:6px; font:inherit; }
  #tree ul { list-style:none; margin:0; padding-left:14px; }
  #tree > ul { padding-left:0; }
  summary { cursor:pointer; padding:2px 0; user-select:none; }
  a.f { display:block; padding:2px 4px; color:var(--fg); text-decoration:none; border-radius:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  a.f:hover { background:#21262d; }
  a.f.sel { background:#1f6feb44; color:var(--accent); }
  #main { flex:1; display:flex; flex-direction:column; min-width:0; }
  header { display:flex; gap:12px; align-items:center; padding:8px 12px; border-bottom:1px solid var(--line); background:var(--panel); }
  header .path { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  header a, header button { color:var(--accent); background:none; border:1px solid var(--line); border-radius:6px; padding:4px 8px; font:inherit; cursor:pointer; text-decoration:none; }
  #view { flex:1; overflow:auto; }
  #view pre { margin:0; }
  #view pre code { display:block; padding:12px; font-size:13px; tab-size:2; }
  #view img, #view video { max-width:100%; }
  #view iframe { width:100%; height:100%; border:0; background:#fff; }
  .pad { padding:16px; }
  .muted { color:#8b949e; }
</style>
</head>
<body>
<nav id="side">
  <input id="filter" placeholder="filter…" />
  <div id="tree" class="muted">loading…</div>
</nav>
<main id="main">
  <header><span class="path muted">select a file</span><a id="raw" hidden target="_blank">raw</a><button id="render" hidden>render</button></header>
  <div id="view" class="pad muted">Pick a file on the left.</div>
</main>
<script>
const SKIP = /(^|\/)(\.git|node_modules|\.DS_Store)(\/|$)/;
const BIN = { img:/\.(png|jpe?g|gif|webp|svg|avif|ico)$/i, audio:/\.(mp3|m4a|wav|ogg)$/i, video:/\.(mp4|webm|mov)$/i, pdf:/\.pdf$/i };
const LANG = { js:'javascript', mjs:'javascript', cjs:'javascript', ts:'typescript', jsx:'javascript', json:'json', html:'xml', xml:'xml', svg:'xml', css:'css', md:'markdown', sh:'bash', bash:'bash', zsh:'bash', yml:'yaml', yaml:'yaml', py:'python', groovy:'groovy', sql:'sql', csv:'plaintext', txt:'plaintext' };
const el = s => document.querySelector(s);

const REPO = 'liorsol/liorsol';
// The file list comes from git, not the filesystem: static hosts serve index.html for a
// directory instead of a listing, so there is nothing to crawl.
async function listFiles() {
  const r = await fetch(`https://api.github.com/repos/${REPO}/git/trees/HEAD?recursive=1`);
  if (!r.ok) throw new Error(`GitHub API ${r.status}`);
  const j = await r.json();
  return j.tree.filter(n => n.type === 'blob' && !SKIP.test(n.path)).map(n => n.path);
}

// Same-origin first (shows the deployed/local copy), raw.githubusercontent for anything the host won't serve.
async function grab(path) {
  const r = await fetch(path);
  return r.ok ? r : fetch(`https://raw.githubusercontent.com/${REPO}/HEAD/${path}`);
}

function renderTree(paths, q) {
  const root = {};
  for (const p of paths) {
    if (q && !p.toLowerCase().includes(q)) continue;
    const parts = p.split('/');
    let node = root;
    parts.forEach((part, i) => { node = node[part] ||= (i === parts.length - 1 ? p : {}); });
  }
  const build = (node, depth) => {
    const ul = document.createElement('ul');
    for (const key of Object.keys(node).sort((a, b) => (typeof node[a] === 'string') - (typeof node[b] === 'string') || a.localeCompare(b))) {
      const li = document.createElement('li');
      if (typeof node[key] === 'string') {
        const a = Object.assign(document.createElement('a'), { className: 'f', textContent: key, href: '#' + node[key] });
        a.dataset.path = node[key];
        li.append(a);
      } else {
        const d = document.createElement('details');
        d.open = !!q || depth === 0;
        d.append(Object.assign(document.createElement('summary'), { textContent: '📁 ' + key }), build(node[key], depth + 1));
        li.append(d);
      }
      ul.append(li);
    }
    return ul;
  };
  el('#tree').replaceChildren(build(root, 0));
  markSelected();
}

function markSelected() {
  const p = decodeURIComponent(location.hash.slice(1));
  document.querySelectorAll('a.f').forEach(a => a.classList.toggle('sel', a.dataset.path === p));
}

async function show(path) {
  const view = el('#view'), raw = el('#raw'), btn = el('#render');
  el('header .path').textContent = path;
  raw.href = path; raw.hidden = false;
  view.className = ''; view.replaceChildren();
  btn.hidden = !/\.html?$/i.test(path);
  const asSource = btn.hidden || btn.dataset.mode === 'source';
  btn.textContent = asSource ? 'render' : 'source';

  if (BIN.img.test(path)) return view.append(pad(Object.assign(document.createElement('img'), { src: path })));
  if (BIN.audio.test(path)) return view.append(pad(Object.assign(document.createElement('audio'), { src: path, controls: true })));
  if (BIN.video.test(path)) return view.append(pad(Object.assign(document.createElement('video'), { src: path, controls: true })));
  if (BIN.pdf.test(path) || !asSource) return view.append(Object.assign(document.createElement('iframe'), { src: path }));

  const r = await grab(path);
  if (!r.ok) { view.className = 'pad muted'; view.textContent = `fetch failed: ${r.status}`; return; }
  const text = await r.text();
  const code = document.createElement('code');
  code.textContent = text;
  const lang = LANG[path.split('.').pop().toLowerCase()];
  // ponytail: 400KB cap — highlight.js blocks the main thread on big blobs; raise it if you never hit a stall.
  if (lang && lang !== 'plaintext' && text.length < 400e3) { code.className = 'language-' + lang; hljs.highlightElement(code); }
  const pre = document.createElement('pre');
  pre.append(code);
  view.append(pre);
}
const pad = n => { const d = document.createElement('div'); d.className = 'pad'; d.append(n); return d; };

el('#render').onclick = e => { e.target.dataset.mode = e.target.dataset.mode === 'source' ? '' : 'source'; show(decodeURIComponent(location.hash.slice(1))); };
addEventListener('hashchange', () => { el('#render').dataset.mode = ''; markSelected(); show(decodeURIComponent(location.hash.slice(1))); });

listFiles().then(paths => {
  renderTree(paths);
  el('#filter').oninput = e => renderTree(paths, e.target.value.trim().toLowerCase());
  if (location.hash) show(decodeURIComponent(location.hash.slice(1)));
}, e => { el('#tree').textContent = 'could not list files: ' + e.message; });
</script>
</body>
</html>
