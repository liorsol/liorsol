<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Repo browser</title>
<script>
  // Applied before the stylesheets load so there's no dark->light flash on a light-mode visit.
  var THEME = localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  document.documentElement.dataset.theme = THEME;
</script>
<link rel="stylesheet" id="hljsTheme" href="">
<script>document.getElementById('hljsTheme').href = 'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/' + (THEME === 'light' ? 'github.min.css' : 'github-dark.min.css');</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/viewerjs/1.11.6/viewer.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/viewerjs/1.11.6/viewer.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root { color-scheme: dark; --bg:#0d1117; --panel:#161b22; --line:#30363d; --fg:#c9d1d9; --muted:#8b949e; --accent:#58a6ff;
          --hover-bg:#21262d; --stripe:#ffffff06; --code-bg:#ffffff14; --code-block-bg:#ffffff0a; --swatch-border:rgba(255,255,255,.25);
          --jt-key:#79c0ff; --jt-str:#a5d6ff; --jt-bool:#ff7b72; }
  :root[data-theme="light"] { color-scheme: light; --bg:#ffffff; --panel:#f6f8fa; --line:#d0d7de; --fg:#1f2328; --muted:#59636e; --accent:#0969da;
          --hover-bg:#eaeef2; --stripe:#0000000a; --code-bg:#0000000f; --code-block-bg:#00000008; --swatch-border:rgba(0,0,0,.25);
          --jt-key:#0550ae; --jt-str:#0a3069; --jt-bool:#cf222e; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; }
  body { display:flex; font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; background:var(--bg); color:var(--fg); }
  #side { width:320px; min-width:180px; max-width:60vw; resize:horizontal; overflow:auto; border-right:1px solid var(--line); background:var(--panel); padding:8px; }
  #filter { width:100%; padding:6px 8px; margin-bottom:8px; background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:6px; font:inherit; }
  #tree ul { list-style:none; margin:0; padding-left:14px; }
  #tree > ul { padding-left:0; }
  summary { cursor:pointer; padding:2px 0; user-select:none; display:flex; align-items:center; gap:6px; }
  summary::marker { color:var(--muted); }
  .row { display:flex; align-items:center; gap:6px; min-width:0; }
  a.f { flex:1; display:block; padding:2px 4px; color:var(--fg); text-decoration:none; border-radius:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
  a.f:hover { background:var(--hover-bg); }
  a.f.sel { background:#1f6feb33; color:var(--accent); }
  .name { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .size { color:var(--muted); font-size:.72rem; flex:0 0 auto; }
  a.gh { color:var(--muted); text-decoration:none; font-size:.85rem; flex:0 0 auto; padding:0 3px; border-radius:4px; }
  a.gh:hover { color:var(--accent); background:var(--hover-bg); }
  #main { flex:1; display:flex; flex-direction:column; min-width:0; }
  header { display:flex; gap:8px; align-items:center; padding:8px 12px; border-bottom:1px solid var(--line); background:var(--panel); }
  header .path { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  header a, header button { color:var(--accent); background:none; border:1px solid var(--line); border-radius:6px; padding:4px 8px; font:inherit; cursor:pointer; text-decoration:none; white-space:nowrap; }
  #menuBtn, #themeBtn { display:none; color:var(--fg); font-size:1.1rem; padding:4px 9px; }
  #themeBtn { display:inline-block; }
  #view { flex:1; overflow:auto; }
  #view pre { margin:0; }
  #view pre code { display:block; padding:12px; font-size:13px; tab-size:2; }
  #view iframe { width:100%; height:100%; border:0; background:#fff; }
  .pad { padding:16px; }
  .muted { color:var(--muted); }
  .swatch { display:inline-block; width:.85em; height:.85em; border-radius:2px; margin-inline-end:.3em; vertical-align:-0.1em; border:1px solid var(--swatch-border); }

  /* image viewer (Viewer.js inline mode owns sizing/scrolling of its own canvas).
     Viewer.js sizes its canvas off this container's real height, so it needs one —
     #view is a definite-height flex item, but isn't itself a flex container, so
     percentage height (not flex:1) is what resolves against it. */
  #imgWrap { height:100%; overflow:hidden; position:relative; }
  /* Viewer.js's inline mode leaves the source <img> in normal flow at native size
     instead of hiding it (its own clone is what's actually displayed) — take it out
     of flow so it neither shows through nor skews the container's layout math. */
  #imgWrap > img { position:absolute; visibility:hidden; }

  /* csv table */
  .csv-scroll { overflow:auto; height:100%; }
  table.csv { border-collapse:collapse; width:100%; font-size:13px; }
  table.csv th, table.csv td { border:1px solid var(--line); padding:0; text-align:left; vertical-align:top; }
  table.csv th { background:var(--panel); position:sticky; top:0; }
  table.csv tr:nth-child(even) td { background:var(--stripe); }
  /* th/td stay display:table-cell (for column/row alignment) — the drag handle lives on an inner
     inline-block div instead, since table cells don't reliably show a native resize handle. */
  table.csv th > div, table.csv td > div { padding:5px 9px; white-space:pre-line; display:inline-block;
    overflow:auto; box-sizing:border-box; min-width:2em; min-height:1.2em; }
  table.csv th > div { resize:horizontal; }
  table.csv td > div { resize:vertical; }

  /* json tree */
  .jsontree { padding:12px; font-size:13px; }
  .jsontree details { margin-inline-start:16px; }
  .jsontree summary { padding:1px 0; }
  .jt-key { color:var(--jt-key); }
  .jt-str { color:var(--jt-str); }
  .jt-num { color:var(--jt-key); }
  .jt-bool, .jt-null { color:var(--jt-bool); }
  .jt-punct, .jt-count { color:var(--muted); }
  .jt-leaf { padding:1px 0 1px 16px; }

  /* markdown */
  .markdown { padding:20px 24px; }
  .markdown h1, .markdown h2, .markdown h3 { border-bottom:1px solid var(--line); padding-bottom:.3em; }
  .markdown h1 { font-size:1.7rem; } .markdown h2 { font-size:1.35rem; } .markdown h3 { font-size:1.1rem; }
  .markdown code { background:var(--code-bg); padding:.15em .4em; border-radius:4px; font-size:.9em; }
  .markdown pre code { background:none; padding:0; }
  .markdown pre { background:var(--code-block-bg); padding:12px; border-radius:8px; overflow:auto; }
  .markdown blockquote { border-inline-start:3px solid var(--line); margin-inline-start:0; padding-inline-start:12px; color:var(--muted); }
  .markdown table { border-collapse:collapse; }
  .markdown th, .markdown td { border:1px solid var(--line); padding:5px 10px; }
  .markdown img { max-width:100%; }
  .markdown a { color:var(--accent); }

  @media (max-width:820px) {
    #menuBtn { display:inline-block; }
    #side { position:fixed; inset:0 25vw 0 0; z-index:20; max-width:none; width:auto; resize:none;
            transform:translateX(-100%); transition:transform .18s ease; box-shadow:2px 0 12px #0008; }
    #side.open { transform:translateX(0); }
    #overlay { display:none; position:fixed; inset:0; background:#0009; z-index:15; }
    #overlay.open { display:block; }
  }
</style>
</head>
<body>
<div id="overlay"></div>
<nav id="side">
  <input id="filter" placeholder="filter…" />
  <div id="tree" class="muted">loading…</div>
</nav>
<main id="main">
  <header>
    <button id="menuBtn" title="Files">☰</button>
    <span class="path muted">select a file</span>
    <div id="actions" style="display:flex; gap:8px;"></div>
    <button id="themeBtn" title="Toggle theme"></button>
  </header>
  <div id="view" class="pad muted">Pick a file on the left.</div>
</main>
<script>
const SKIP = /(^|\/)(\.git|node_modules|\.DS_Store)(\/|$)/;
const BIN = { img:/\.(png|jpe?g|gif|webp|avif|ico)$/i, svg:/\.svg$/i, audio:/\.(mp3|m4a|wav|ogg)$/i, video:/\.(mp4|webm|mov)$/i, pdf:/\.pdf$/i };
const LANG = { js:'javascript', mjs:'javascript', cjs:'javascript', ts:'typescript', jsx:'javascript', json:'json', html:'xml', xml:'xml', svg:'xml', css:'css', md:'markdown', sh:'bash', bash:'bash', zsh:'bash', yml:'yaml', yaml:'yaml', py:'python', groovy:'groovy', sql:'sql', csv:'plaintext', txt:'plaintext' };
const el = s => document.querySelector(s);
const ext = path => path.split('.').pop().toLowerCase();
const encPath = path => path.split('/').map(encodeURIComponent).join('/');
const fmtSize = n => n == null ? '' : n < 1024 ? n + ' B' : n < 1024 ** 2 ? (n / 1024).toFixed(1) + ' KB' : (n / 1024 ** 2).toFixed(1) + ' MB';

const REPO = 'liorsol/liorsol';
const BRANCH = 'main';
const ghEdit = path => `https://github.com/${REPO}/edit/${BRANCH}/${encPath(path)}`;
const ghTree = path => `https://github.com/${REPO}/tree/${BRANCH}/${encPath(path)}`;

let SIZES = new Map();
// The file list comes from git, not the filesystem: static hosts serve index.html for a
// directory instead of a listing, so there is nothing to crawl.
async function listFiles() {
  // no-cache revalidates instead of serving a stale tree; a 304 costs no rate limit.
  const r = await fetch(`https://api.github.com/repos/${REPO}/git/trees/HEAD?recursive=1`, { cache: 'no-cache' });
  if (!r.ok) throw new Error(`GitHub API ${r.status}`);
  const j = await r.json();
  const blobs = j.tree.filter(n => n.type === 'blob' && !SKIP.test(n.path));
  SIZES = new Map(blobs.map(n => [n.path, n.size]));
  return blobs.map(n => n.path);
}

// Same-origin first (shows the deployed/local copy), raw.githubusercontent for anything the host won't serve.
async function grab(path) {
  const r = await fetch(path);
  return r.ok ? r : fetch(`https://raw.githubusercontent.com/${REPO}/HEAD/${path}`);
}

// --- tree (sidebar) -------------------------------------------------------

function buildTree(paths) {
  const root = { children: new Map(), dir: '' };
  for (const path of paths) {
    const parts = path.split('/');
    let node = root;
    parts.forEach((part, i) => {
      node.children ||= new Map();
      if (!node.children.has(part)) node.children.set(part, { dir: node.dir ? node.dir + '/' + part : part });
      node = node.children.get(part);
      if (i === parts.length - 1) node.path = path;
    });
  }
  return root;
}
function folderSize(node) {
  if (node.path != null) return SIZES.get(node.path) || 0;
  if (node._size != null) return node._size;
  let sum = 0;
  for (const child of node.children.values()) sum += folderSize(child);
  return node._size = sum;
}

function renderTree(paths, q) {
  const filtered = q ? paths.filter(p => p.toLowerCase().includes(q)) : paths;
  const root = buildTree(filtered);
  const build = (node, depth) => {
    const ul = document.createElement('ul');
    const keys = [...node.children.keys()].sort((a, b) => {
      const fa = node.children.get(a).path != null, fb = node.children.get(b).path != null;
      return fa - fb || a.localeCompare(b);
    });
    for (const key of keys) {
      const child = node.children.get(key);
      const li = document.createElement('li');
      if (child.path != null) {
        const row = document.createElement('div');
        row.className = 'row';
        const a = Object.assign(document.createElement('a'), { className: 'f', href: '#' + child.path });
        a.dataset.path = child.path;
        a.append(Object.assign(document.createElement('span'), { className: 'name', textContent: key }));
        const size = Object.assign(document.createElement('span'), { className: 'size', textContent: fmtSize(SIZES.get(child.path)) });
        const gh = Object.assign(document.createElement('a'), { className: 'gh', href: ghEdit(child.path), target: '_blank', title: 'Edit on GitHub', textContent: '✎' });
        gh.onclick = e => e.stopPropagation();
        row.append(a, size, gh);
        li.append(row);
      } else {
        const d = document.createElement('details');
        d.open = !!q || depth === 0;
        const summary = document.createElement('summary');
        summary.append(Object.assign(document.createElement('span'), { className: 'name', textContent: '📁 ' + key }));
        summary.append(Object.assign(document.createElement('span'), { className: 'size', textContent: fmtSize(folderSize(child)) }));
        const gh = Object.assign(document.createElement('a'), { className: 'gh', href: ghTree(child.dir), target: '_blank', title: 'View on GitHub', textContent: '↗' });
        gh.onclick = e => e.stopPropagation();
        summary.append(gh);
        d.append(summary, build(child, depth + 1));
        li.append(d);
      }
      ul.append(li);
    }
    return ul;
  };
  el('#tree').replaceChildren(build(root, 0));
  markSelected();
}

function markSelected() {
  const p = decodeURIComponent(location.hash.slice(1));
  document.querySelectorAll('a.f').forEach(a => a.classList.toggle('sel', a.dataset.path === p));
}

// --- mobile menu -----------------------------------------------------------

el('#menuBtn').onclick = () => { el('#side').classList.add('open'); el('#overlay').classList.add('open'); };
el('#overlay').onclick = closeMenu;
function closeMenu() { el('#side').classList.remove('open'); el('#overlay').classList.remove('open'); }

// --- theme ------------------------------------------------------------------

function applyTheme(theme) {
  document.documentElement.dataset.theme = theme;
  el('#hljsTheme').href = `https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/${theme === 'light' ? 'github.min' : 'github-dark.min'}.css`;
  el('#themeBtn').textContent = theme === 'light' ? '🌙' : '☀️';
  localStorage.setItem('theme', theme);
}
applyTheme(THEME);
el('#themeBtn').onclick = () => applyTheme(document.documentElement.dataset.theme === 'light' ? 'dark' : 'light');

// --- viewer ----------------------------------------------------------------

const pad = n => { const d = document.createElement('div'); d.className = 'pad'; d.append(n); return d; };

function setActions(nodes) { el('#actions').replaceChildren(...nodes); }
function actionBtn(label, onclick) { const b = document.createElement('button'); b.textContent = label; b.onclick = onclick; return b; }
function actionLink(label, href) { return Object.assign(document.createElement('a'), { textContent: label, href, target: '_blank' }); }

async function show(path) {
  const view = el('#view');
  el('header .path').textContent = path;
  view.className = ''; view.replaceChildren();
  closeMenu();

  const raw = actionLink('raw', path);
  const e = ext(path);

  if (BIN.img.test(path) || BIN.svg.test(path)) { setActions([raw]); return showImage(path); }
  if (BIN.audio.test(path)) { setActions([raw]); return view.append(pad(Object.assign(document.createElement('audio'), { src: path, controls: true }))); }
  if (BIN.video.test(path)) { setActions([raw]); return view.append(pad(Object.assign(document.createElement('video'), { src: path, controls: true }))); }
  if (BIN.pdf.test(path)) { setActions([raw]); return view.append(Object.assign(document.createElement('iframe'), { src: path })); }

  if (/\.html?$/i.test(path)) return showHtml(path, raw);

  const r = await grab(path);
  if (!r.ok) { setActions([raw]); view.className = 'pad muted'; view.textContent = `fetch failed: ${r.status}`; return; }
  const text = await r.text();

  if (e === 'csv') { setActions([raw]); return showCsv(text); }
  if (e === 'json') return showJson(text, raw);
  if (e === 'md' || e === 'markdown') { setActions([raw]); return showMarkdown(text); }
  return showCode(text, path, raw);
}

function showCode(text, path, raw) {
  setActions([raw]);
  const view = el('#view');
  const code = document.createElement('code');
  code.textContent = text;
  const lang = LANG[ext(path)];
  // ponytail: 400KB cap — highlight.js blocks the main thread on big blobs; raise it if you never hit a stall.
  if (lang && lang !== 'plaintext' && text.length < 400e3) {
    code.className = 'language-' + lang;
    hljs.highlightElement(code);
    if (lang === 'css') addColorSwatches(code);
  }
  const pre = document.createElement('pre');
  pre.append(code);
  view.append(pre);
}

// Drop a live color swatch right before each color literal in the highlighted code.
// hljs tokenizes rgba(...)/hsla(...) into many spans, so a match can span several text
// nodes — only its *start* character is guaranteed to sit in a single node, so that's
// all we rely on: split that node there and insert the swatch.
function addColorSwatches(code) {
  const text = code.textContent;
  const COLOR = /#(?:[0-9a-f]{3,8})\b|\b(?:rgba?|hsla?)\([^)]*\)/gi;
  const matches = [];
  for (let m; (m = COLOR.exec(text));) matches.push({ start: m.index, value: m[0] });
  if (!matches.length) return;

  // Read pass first, over the untouched tree: a TreeWalker revisits nodes we split
  // mid-traversal (the freshly-created tail is still a text node ahead of the cursor),
  // which would double-count their length and desync every offset after it.
  const ranges = [];
  const walker = document.createTreeWalker(code, NodeFilter.SHOW_TEXT);
  let offset = 0;
  for (let n; (n = walker.nextNode());) {
    ranges.push({ node: n, start: offset, end: offset + n.textContent.length });
    offset = ranges[ranges.length - 1].end;
  }

  for (const { node: n, start, end } of ranges) {
    const here = matches.filter(m => m.start >= start && m.start < end).sort((a, b) => b.start - a.start);
    let node = n;
    for (const m of here) {
      const tail = node.splitText(m.start - start);
      const sw = document.createElement('span');
      sw.className = 'swatch';
      sw.style.background = m.value;
      tail.parentNode.insertBefore(sw, tail);
    }
  }
}

function showCsv(text) {
  const rows = Papa.parse(text, { skipEmptyLines: true }).data;
  const view = el('#view');
  view.className = 'csv-scroll';
  if (!rows.length) { view.textContent = '(empty)'; return; }
  const [head, ...body] = rows;
  const table = document.createElement('table');
  table.className = 'csv';
  table.innerHTML = `<thead><tr>${head.map(h => `<th><div>${escHtml(h)}</div></th>`).join('')}</tr></thead>` +
    `<tbody>${body.map(r => `<tr>${r.map(c => `<td><div>${escHtml(c)}</div></td>`).join('')}</tr>`).join('')}</tbody>`;
  view.append(table);
}
const escHtml = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// Collapsible JSON tree: default state shows depth 1 (top-level keys), nested values start closed.
function showJson(text, raw) {
  const view = el('#view');
  view.className = 'jsontree';
  let data;
  try { data = JSON.parse(text); }
  catch (err) { setActions([raw]); view.className = 'pad muted'; view.textContent = 'invalid JSON: ' + err.message; return; }
  view.replaceChildren(jsonNode(data, 0));
  setActions([actionBtn('collapse all', () => view.querySelectorAll('details').forEach(d => d.open = false)),
              actionBtn('expand all', () => view.querySelectorAll('details').forEach(d => d.open = true)),
              raw]);
}
function jsonNode(value, depth) {
  if (value !== null && typeof value === 'object') {
    const isArr = Array.isArray(value);
    const entries = isArr ? value.map((v, i) => [i, v]) : Object.entries(value);
    const details = document.createElement('details');
    details.open = depth < 1;
    const summary = document.createElement('summary');
    summary.innerHTML = `<span class="jt-punct">${isArr ? '[' : '{'}</span> <span class="jt-count">${entries.length} ${isArr ? 'items' : 'keys'}</span>`;
    details.append(summary);
    for (const [k, v] of entries) {
      const row = document.createElement('div');
      if (!isArr) row.innerHTML = `<span class="jt-key">"${escHtml(String(k))}"</span><span class="jt-punct">: </span>`;
      row.append(jsonNode(v, depth + 1));
      details.append(row);
    }
    return details;
  }
  const span = document.createElement('span');
  span.className = 'jt-leaf ' + (value === null ? 'jt-null' : typeof value === 'string' ? 'jt-str' : typeof value === 'number' ? 'jt-num' : 'jt-bool');
  span.textContent = value === null ? 'null' : typeof value === 'string' ? `"${value}"` : String(value);
  return span;
}

// marked dropped the sync `highlight` option a few majors back; a renderer override still works.
marked.use({ renderer: { code(code, lang) {
  const language = hljs.getLanguage(lang) ? lang : 'plaintext';
  return `<pre><code class="hljs language-${language}">${hljs.highlight(code, { language }).value}</code></pre>`;
} } });

// ponytail: no HTML sanitizer — every markdown file comes from this same repo, not a stranger's upload.
function showMarkdown(text) {
  const view = el('#view');
  view.className = 'markdown';
  const hebrew = (text.match(/[֐-׿]/g) || []).length;
  const latin = (text.match(/[A-Za-z]/g) || []).length;
  view.dir = hebrew > latin ? 'rtl' : 'ltr';
  view.innerHTML = marked.parse(text);
}

function showHtml(path, raw) {
  const view = el('#view');
  const btn = actionBtn('', () => { btn.dataset.mode = btn.dataset.mode === 'source' ? '' : 'source'; show(path); });
  const asSource = btn.dataset.mode === 'source';
  btn.textContent = asSource ? 'render' : 'source';
  setActions([btn, raw]);
  if (!asSource) return view.append(Object.assign(document.createElement('iframe'), { src: path }));
  grab(path).then(async r => showCode(r.ok ? await r.text() : `fetch failed: ${r.status}`, path, raw));
}

let imgViewer = null; // tracks the current Viewer.js instance so it can be destroyed before the next one is created

function showImage(path) {
  const view = el('#view');
  const wrap = document.createElement('div');
  wrap.id = 'imgWrap';
  const img = document.createElement('img');
  img.src = path;
  wrap.append(img);
  view.append(wrap);

  if (imgViewer) imgViewer.destroy();
  // navbar/title off: single image, no gallery filmstrip or filename caption needed.
  // toolbar keeps zoom/rotate/flip (replaces our old hand-rolled zoom buttons) but drops
  // prev/play/next, which only make sense for a multi-image gallery.
  // transition:false: viewer.js's "viewed" event (and every zoom call gated behind it —
  // toolbar buttons, wheel, our own zoomTo) waits on a CSS transitionend that some
  // browser contexts never fire, permanently stalling the viewer. Skipping the animation
  // makes the fit-to-view snap into place synchronously and instantly instead of racing it.
  imgViewer = new Viewer(img, {
    inline: true, navbar: false, title: false, transition: false,
    toolbar: { zoomIn: true, zoomOut: true, oneToOne: true, reset: true, prev: false, play: false, next: false, rotateLeft: true, rotateRight: true, flipHorizontal: true, flipVertical: true },
    // viewer.js's own initial-fit ratio comes out wrong in inline mode (its own docs set
    // the ratio explicitly here rather than trust it) — set "fit to view, no upscaling"
    // ourselves.
    viewed() {
      const { width: cw, height: ch } = wrap.getBoundingClientRect();
      imgViewer.zoomTo(Math.min(cw / img.naturalWidth, ch / img.naturalHeight, 1));
    },
  });

  setActions([actionLink('raw', path)]);
}

el('#filter').oninput = e => renderTree(ALL_PATHS, e.target.value.trim().toLowerCase());
addEventListener('hashchange', () => { markSelected(); show(decodeURIComponent(location.hash.slice(1))); });

let ALL_PATHS = [];
listFiles().then(paths => {
  ALL_PATHS = paths;
  renderTree(paths);
  if (location.hash) show(decodeURIComponent(location.hash.slice(1)));
}, e => { el('#tree').textContent = 'could not list files: ' + e.message; });
</script>
</body>
