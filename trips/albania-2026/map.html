<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
  :root{
    --sea:#0c4b57; --sea-deep:#072f38; --azure:#1b8a9e;
    --sand:#f7efe0; --paper:#fffdf8;
    --terra:#d96b4f; --terra-deep:#b5482f; --gold:#e3a23a; --olive:#6f8a5b;
    --ink:#1d2a2e; --ink-soft:#465256; --line:#e3d8c4;
  }
  *{box-sizing:border-box}
  /* Column layout so #map just takes whatever is left — the filter row's height
     changes when the chips shrink to fit, and a magic-number offset would drift. */
  html,body{height:100%}
  body{margin:0; display:flex; flex-direction:column; overflow:hidden;
    background:var(--sand); color:var(--ink); font-family:'Assistant',sans-serif; font-size:16px}
  h1,h2{font-family:'Suez One',serif; font-weight:400; color:var(--sea); margin:0}
  .bar{background:rgba(9,58,68,.97); border-bottom:2px solid var(--gold); padding:12px 18px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap}
  .bar h1{color:#fff; font-size:19px}
  .back{background:var(--gold); color:#3a2a08; text-decoration:none; font-family:'Heebo',sans-serif;
    font-weight:700; font-size:14px; white-space:nowrap; padding:8px 16px; border-radius:999px; transition:.15s}
  .back:hover{background:#fff}
  /* Embedded in the trip page's #map view — its side menu replaces this back link,
     and under 900px its ☰ button floats over this bar, so leave room for it. */
  .embed .back{display:none}
  @media (max-width:900px){ .embed .bar h1{padding-inline-start:48px} }
  /* One row, never wrapping. fitChips() shrinks the font until it fits, so every
     length here is in em — padding, radius and the count all scale together. */
  .filters{display:flex; gap:.45em; flex-wrap:nowrap; overflow-x:auto; overflow-y:hidden; font-size:13px;
    padding:9px 12px; background:var(--paper); border-bottom:1px solid var(--line)}
  .filters button{flex:0 0 auto; font-family:'Heebo',sans-serif; font-weight:700; font-size:1em;
    line-height:1.15; white-space:nowrap; cursor:pointer; padding:.42em .85em; border-radius:999px;
    border:1.5px solid var(--line); color:var(--ink-soft); background:#fff; transition:.15s}
  .filters button:hover{border-color:var(--azure); color:var(--sea)}
  /* On = the category's own pin colour, which is what the removed legend used to say. */
  .filters button.on{background:var(--c,var(--sea)); border-color:var(--c,var(--sea)); color:#fff}
  .filters button.some{background:#8d9a9e; border-color:#8d9a9e; color:#fff}   /* הכל, partly selected */
  .filters .n{font-weight:500; opacity:.62; margin-inline-start:.4em}
  .filters .tx{margin-inline-start:.35em}
  /* Two steps fitChips() falls back to before shrinking further: drop the counts,
     then drop the words and let the emoji carry the category (it already does on
     the pins). הכל keeps its word — three characters, and no emoji says "all". */
  .filters.hide-n .n{display:none}
  .filters.hide-tx .tx{display:none}
  .filters.hide-tx .ic{font-size:1.3em}
  .filters.hide-tx{gap:.3em}                            /* a lone emoji needs far less around it */
  .filters.hide-tx button{padding:.34em .5em}
  #map{flex:1; min-height:0; width:100%}
  @media print{ body{display:block; overflow:visible} #map{flex:none; height:520px} .bar .back,.filters{display:none} }
  .leaflet-popup-content{font-family:'Assistant',sans-serif; direction:rtl; text-align:right; font-size:14.5px; line-height:1.5}
  .leaflet-popup-content b{font-family:'Heebo',sans-serif; color:var(--sea)}
  .leaflet-popup-content a{color:var(--terra-deep); font-family:'Heebo',sans-serif; font-weight:700; font-size:13px}
  .pin{display:flex; align-items:center; justify-content:center; width:26px; height:26px; border-radius:50% 50% 50% 0; transform:rotate(45deg); box-shadow:0 2px 6px rgba(0,0,0,.35); border:2px solid #fff}
  .pin span{transform:rotate(-45deg); font-size:13px}
  .leaflet-control-layers{font-family:'Assistant',sans-serif; direction:rtl; text-align:right; font-size:14px}
</style>

  {n:'הפירמידה של טירנה', cat:'tirana', lat:41.323, lng:19.8215, q:'Pyramid+of+Tirana', note:'אפשר לטפס במדרגות החיצוניות — חינם', v:'tirana/tirana-walk'},
  {n:'מסגד את׳הם ביי', cat:'tirana', lat:41.3275, lng:19.8194, q:'Et+hem+Bej+Mosque+Tirana', note:'בפינת כיכר סקנדרבג', v:'tirana/tirana-walk'},

  {n:'פאזארי אירי (שוק)', cat:'tirana', lat:41.3303, lng:19.8246, q:'Pazari+i+Ri+Tirana', v:'tirana/tirana-walk'},

  {n:'המוזיאון הלאומי להיסטוריה', cat:'tirana', lat:41.3293, lng:19.8172, q:'National+History+Museum+Tirana', v:'tirana/museums'},
  {n:'הפארק הגדול של טירנה', cat:'tirana', lat:41.3117, lng:19.8281, q:'Grand+Park+of+Tirana', v:'tirana/grandpark'},

  {n:'Zipline Albania, פטרלה', cat:'north', lat:41.2606, lng:19.8525, q:'Zipline+Albania+Petrele', note:'~1,250 מ׳ · גיל 10+ · 35–125 ק״ג · ~€15–25', v:'north/petrela'},

  {n:'טיילת וְלורה', cat:'drive', lat:40.4674, lng:19.4905, q:'Vlore+Promenade', note:'חניה מאתגרת בעונה · טיילת באורך ~4 ק״מ — זהו הקצה הצפוני, ליד קוזום באבא', v:'drive/stops-coastal'},

  {n:'איי קסאמיל', cat:'south', lat:39.7751, lng:19.9961, q:'Ksamil+Islands', v:'south/ksamil'},
  {n:'חוף המראה (Pasqyrat)', cat:'south', lat:39.8043, lng:20.0053, q:'Mirror+Beach+Ksamil', note:'בין סרנדה לקסאמיל — ~4 ק״מ צפונית לקסאמיל, נסיעה', v:'south/ksamil'},

  {n:'העין הכחולה (Syri i Kaltër)', cat:'south', lat:39.9238, lng:20.1925, q:'Blue+Eye+Syri+i+Kalter+Saranda', note:'שחייה אסורה, ~10°C', v:'south/blueeye'},
  {n:'סרנדה — הטיילת', cat:'drive', lat:39.8756, lng:20.0053, q:'Saranda+Promenade+Albania', note:'העצירה האחרונה לפני קסאמיל · סופר, כספומט, מסעדות', v:'drive/stops-coastal'},

];

var map = L.map('map', {zoomControl:true}).setView([41.0, 19.9], 8);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

var layerGroups = {}, groupBounds = {};
Object.keys(CATS).forEach(function(k){ layerGroups[k] = L.layerGroup(); groupBounds[k] = []; });

var byQ = {};
function addPlaces(){
  PLACES.forEach(function(p){
  var c = CATS[p.cat];
  var icon = L.divIcon({
    className:'', html:'<div class="pin" style="background:'+c.color+'"><span>●</span></div>',
    iconSize:[26,26], iconAnchor:[13,26], popupAnchor:[0,-24]
  });
  var mapsUrl = p.url || 'https://www.google.com/maps/search/?api=1&query='+p.q;
  /* `v` is the pin's card on the trip page. target=_top because this file is
     normally running inside the trip page's #map view — without it the whole
     site would load into the iframe. Standalone, _top is this window anyway. */
  var html = '<b>'+p.n+'</b>' + (p.note ? '<br>'+p.note : '') +
             '<br><a href="'+mapsUrl+'" target="_blank" rel="noopener">מפה / ניווט ↖</a>' +
             (p.v ? ' · <a href="index.html#'+p.v+'" target="_top">מידע באתר ←</a>' : '');
  p.marker = L.marker([p.lat, p.lng], {icon:icon}).bindPopup(html).addTo(layerGroups[p.cat]);
  byQ[p.q] = p;
  groupBounds[p.cat].push([p.lat, p.lng]);
  });
}

/* The chips are the only filter UI — Leaflet's own layers control is gone, so
   each chip wears its category's pin colour to keep the colour↔category key.
   Categories toggle independently; `shown` is the whole state. */
var CAT_KEYS = Object.keys(CATS);
var shown = {}, pinned = null;

function setAll(v){ CAT_KEYS.forEach(function(k){ shown[k] = v; }); }
function countOn(){ return CAT_KEYS.filter(function(k){ return shown[k]; }).length; }

/* Two hash forms, both fed by links on the trip page:
     #<category>  — open with just that section's pins showing (the per-view maps)
     #p:<q>       — zoom to one pin and open its popup. <q> is the pin's Google
                    Maps query string — or, for restaurants, the restaurants.json
                    id — which is the same token the trip page already has next to
                    that place, so the internal link needs no second identifier.
   No hash, or anything unrecognised, = everything. The hash is only an entry
   point: toggling chips afterwards changes `shown` and leaves the URL alone,
   because an arbitrary subset has no sensible hash form. */
function fromHash(){
  var h = location.hash.replace(/^#/, '');
  try{ h = decodeURIComponent(h); }catch(e){}
  pinned = h.indexOf('p:') === 0 ? byQ[h.slice(2)] : null;
  var cat = pinned ? pinned.cat : h;
  if(CATS[cat]){ setAll(false); shown[cat] = true; }
  else setAll(true);
  render();
}

function render(){
  var bounds = [], visible = 0;
  CAT_KEYS.forEach(function(k){
    if(shown[k]){
      layerGroups[k].addTo(map);
      bounds = bounds.concat(groupBounds[k]);
      visible += groupBounds[k].length;
    } else if(map.hasLayer(layerGroups[k])) map.removeLayer(layerGroups[k]);
  });

  var on = countOn();
  var only = on === 1 && CAT_KEYS.filter(function(k){ return shown[k]; })[0];
  document.getElementById('title').textContent =
    pinned            ? '📍 ' + pinned.n
    : on === CAT_KEYS.length ? '🗺️ מפת המסלול — כל ' + PLACES.length + ' המקומות בתכנית'
    : on === 0        ? '🗺️ מפת המסלול — לא נבחרה אף קטגוריה'
    : only            ? CATS[only].label + ' — ' + visible + ' נקודות'   /* labels already carry an emoji */
                      : '🗺️ ' + visible + ' מקומות · ' + on + ' קטגוריות';

  document.querySelectorAll('#filters button').forEach(function(b){
    var k = b.dataset.cat;
    b.classList.toggle('on', k ? !!shown[k] : on === CAT_KEYS.length);
    b.classList.toggle('some', !k && on > 0 && on < CAT_KEYS.length);
    b.setAttribute('aria-pressed', k ? !!shown[k] : on === CAT_KEYS.length);
  });

  map.invalidateSize();
  if(pinned && shown[pinned.cat]){ map.setView([pinned.lat, pinned.lng], 14); pinned.marker.openPopup(); }
  else if(bounds.length) map.fitBounds(bounds, {padding:[30,30]});
}

/* Seven chips, one line, as large as they will go. Text width is font- and
   language-dependent, so this measures rather than guesses: start at the size the
   chips have always been and step down only as far as the row needs.
   Font size alone is not enough — full chips need ~660px even at 8.5px, which no
   phone has — so it walks three content levels first and only shrinks within each,
   keeping the type readable instead of fitting it by making it tiny. */
var CHIP_PX = 13;
var LEVELS = [                    /* each level's floor: words have to stay readable, icons don't */
  {cls:'',               min:10},
  {cls:'hide-n',         min:10},
  {cls:'hide-n hide-tx', min:7}
];
function fitChips(){
  var f = document.getElementById('filters');
  if(!f.clientWidth) return;      /* laid out while hidden — measuring would shrink to nothing */
  for(var i = 0; i < LEVELS.length; i++){
    f.className = 'filters ' + LEVELS[i].cls;
    for(var s = CHIP_PX; s >= LEVELS[i].min; s -= 0.5){
      f.style.fontSize = s + 'px';
      if(f.scrollWidth <= f.clientWidth) return;
    }
  }
  /* Narrower than seven icons will ever go (~320px). Shrinking further buys almost
     nothing — emoji come from a bitmap font that stops tracking font-size — so keep
     them full size and let .filters scroll, rather than tiny *and* scrolling. */
  f.style.fontSize = CHIP_PX + 'px';
}

function init(){
  addPlaces();
  var f = document.getElementById('filters');
  f.innerHTML = '<button type="button" data-cat="">הכל<span class="n">' + PLACES.length + '</span></button>' +
    CAT_KEYS.map(function(k){
      return '<button type="button" data-cat="'+k+'" style="--c:'+CATS[k].color+'" title="'+CATS[k].label+'">' +
             '<span class="ic">' + CATS[k].ic + '</span><span class="tx">' + CATS[k].tx + '</span>' +
             '<span class="n">' + groupBounds[k].length + '</span></button>';
    }).join('');

  f.addEventListener('click', function(e){
    var b = e.target.closest('button[data-cat]');
    if(!b) return;
    pinned = null;                       // stop re-zooming to a deep-linked pin
    var k = b.dataset.cat;
    if(k) shown[k] = !shown[k];
    else  setAll(countOn() < CAT_KEYS.length);   // הכל: all on unless already all on
    render();
  });

  window.addEventListener('hashchange', fromHash);
  window.addEventListener('popstate', fromHash);
  window.addEventListener('resize', fitChips);
  fromHash();
  fitChips();
}

/* The 🍽️ pins come from restaurants.json — the same file the trip page's food
   view renders, so a restaurant is added or corrected in one place and appears
   in both. Their `q` is the JSON id, which is exactly what the page's 🗺️ chips
   link to (#p:<id>), so the two sides still need no second identifier.
   Everything is drawn after the fetch settles; if it fails the rest of the map
   still comes up, minus the restaurants. */
var CITY_HE = {tirana:'טירנה', berat:'בראט', saranda:'סרנדה', ksamil:'קסאמיל',
               gjirokaster:'ג׳ירוקסטרה', durres:'דורס', shkoder:'שקודרה'};
fetch('restaurants.json').then(function(r){ return r.json(); }).then(function(list){
  list.forEach(function(r){
    var facts = [r.type, r.score ? '⭐ ' + r.score : '', r.hours].filter(Boolean).join(' · ');
    PLACES.push({
      n: r.name + (CITY_HE[r.city] ? ', ' + CITY_HE[r.city] : ''),
      cat:'food', lat:r.lat, lng:r.lng,
      q: r.id, url: r.gmaps,
      note: facts + (r.note ? '<br>' + r.note : ''),
      v: r.view || 'food/restaurants'
    });
  });
}).catch(function(){}).then(init);
</script>
</body>
</html>
