<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420"
     role="img" font-family="Heebo, Arial, sans-serif">
  <title>מהנחיתה בטרמינל 3 אל המיניוואן מול דלת 4 ברמת היציאות</title>
  <desc>נוחתים בקומת הקרקע של טרמינל 3 — אולם הנכנסים, שהיציאות בו ממוספרות 1 עד 6. יוצאים ביציאה 4, ומיד מחוץ לדלת יש דרגנוע שעולה קומה אחת אל רמת היציאות. שם שבע כניסות ממוספרות 1 עד 7, והמיניוואן ממתין מול כניסה 4. אם הוא לא שם, נקודת האיסוף הרשמית של השדה היא בין כניסה 1 לכניסה 2.</desc>

  <!-- Deliberately almost text-free: RTL prose inside SVG collides at any size the
       page might scale it to, and the page already carries the steps as real HTML.
       The picture answers only "which floor, which door". -->
  <rect width="900" height="420" fill="#f6f1e4"/>

  <!-- ================= DEPARTURES — first level, the minivan ================= -->
  <rect x="24" y="20" width="852" height="152" rx="14" fill="#2f5d3a"/>
  <text x="852" y="47" font-size="16" font-weight="700" fill="#fffdf7" text-anchor="start" direction="rtl">
    ⬆ רמת היציאות — כאן המיניוואן</text>
  <text x="852" y="66" font-size="12.5" font-weight="400" fill="#cfe0c8" text-anchor="end">
    Partenze / Departures · piano primo</text>

  <!-- the numbered entrances: 1 at the Terminal 1 end, so 1 sits on the right -->
  <rect x="268" y="84" width="588" height="40" rx="7" fill="#e8f0e2"/>
  <g font-size="15" font-weight="700" fill="#4d5a50" text-anchor="middle">
    <rect x="778" y="89" width="70" height="30" rx="5" fill="#fffdf7" stroke="#b9cdb2"/><text x="813" y="110">1</text>
    <rect x="696" y="89" width="70" height="30" rx="5" fill="#fffdf7" stroke="#b9cdb2"/><text x="731" y="110">2</text>
    <rect x="614" y="89" width="70" height="30" rx="5" fill="#fffdf7" stroke="#b9cdb2"/><text x="649" y="110">3</text>
    <rect x="524" y="82" width="82" height="44" rx="6" fill="#d9a13a" stroke="#8a6714" stroke-width="2.5"/>
    <text x="565" y="113" font-size="21" font-weight="900" fill="#26302a">4</text>
    <rect x="442" y="89" width="70" height="30" rx="5" fill="#fffdf7" stroke="#b9cdb2"/><text x="477" y="110">5</text>
    <rect x="360" y="89" width="70" height="30" rx="5" fill="#fffdf7" stroke="#b9cdb2"/><text x="395" y="110">6</text>
    <rect x="278" y="89" width="70" height="30" rx="5" fill="#fffdf7" stroke="#b9cdb2"/><text x="313" y="110">7</text>
  </g>

  <!-- the kerb roadway, with the minivan parked at door 4 -->
  <rect x="44" y="132" width="812" height="30" rx="6" fill="#4a5a4c"/>
  <line x1="44" y1="147" x2="856" y2="147" stroke="#cfe0c8" stroke-width="2.5" stroke-dasharray="12 12" opacity=".5"/>
  <g transform="translate(521,134)">
    <rect x="0" y="2" width="88" height="25" rx="6" fill="#fffdf7" stroke="#26302a" stroke-width="1.5"/>
    <rect x="8" y="6" width="30" height="11" rx="2" fill="#8fb8d8"/>
    <circle cx="20" cy="27" r="4.5" fill="#26302a"/><circle cx="70" cy="27" r="4.5" fill="#26302a"/>
    <text x="63" y="16" font-size="9" font-weight="900" fill="#1a4f8a" text-anchor="middle">BLU</text>
  </g>

  <!-- the official pick-up point, which is NOT door 4 — the fallback -->
  <g opacity=".9">
    <circle cx="772" cy="147" r="7" fill="none" stroke="#f3d79a" stroke-width="2.5"/>
    <text x="772" y="151" font-size="9" font-weight="900" fill="#f3d79a" text-anchor="middle">P</text>
  </g>

  <!-- ================= the one level between them ================= -->
  <g>
    <path d="M470 248 L470 190" stroke="#d9a13a" stroke-width="10" stroke-linecap="round"/>
    <path d="M470 184 l-14 21 h28 z" fill="#d9a13a"/>
    <text x="452" y="224" font-size="14" font-weight="700" fill="#98452a" text-anchor="start" direction="rtl">
      דרגנוע או מעלית — קומה אחת מעלה</text>
  </g>

  <!-- ================= ARRIVALS — ground level, where we land ================= -->
  <rect x="24" y="264" width="852" height="140" rx="14" fill="#4d5a50"/>
  <text x="852" y="291" font-size="16" font-weight="700" fill="#fffdf7" text-anchor="start" direction="rtl">
    ⬇ רמת הנכנסים — כאן נוחתים</text>
  <text x="852" y="310" font-size="12.5" font-weight="400" fill="#dfe5dd" text-anchor="end">
    Arrivi / Arrivals · piano terra</text>

  <rect x="350" y="328" width="506" height="40" rx="7" fill="#e4e8e2"/>
  <g font-size="15" font-weight="700" fill="#4d5a50" text-anchor="middle">
    <rect x="778" y="333" width="70" height="30" rx="5" fill="#fffdf7" stroke="#aab5a9"/><text x="813" y="354">1</text>
    <rect x="696" y="333" width="70" height="30" rx="5" fill="#fffdf7" stroke="#aab5a9"/><text x="731" y="354">2</text>
    <rect x="614" y="333" width="70" height="30" rx="5" fill="#fffdf7" stroke="#aab5a9"/><text x="649" y="354">3</text>
    <rect x="524" y="326" width="82" height="44" rx="6" fill="#d9a13a" stroke="#8a6714" stroke-width="2.5"/>
    <text x="565" y="357" font-size="21" font-weight="900" fill="#26302a">4</text>
    <rect x="442" y="333" width="70" height="30" rx="5" fill="#fffdf7" stroke="#aab5a9"/><text x="477" y="354">5</text>
    <rect x="360" y="333" width="70" height="30" rx="5" fill="#fffdf7" stroke="#aab5a9"/><text x="395" y="354">6</text>
  </g>
  <text x="565" y="388" font-size="13" font-weight="500" fill="#e4e8e2" text-anchor="middle" direction="rtl">
    יוצאים ביציאה 4</text>
</svg>
